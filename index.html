<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloxy</title>
    <link data-trunk rel="rust" data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
    <style>
      html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading {
        position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3vmin; background: #10141a;
        color: #e8efe8; font: 600 2.2vmin ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.2em; text-transform: uppercase; text-align: center;
      }
      #loading h1 { margin: 0; font-size: 6vmin; letter-spacing: 0.15em; text-shadow: 0.5vmin 0.5vmin 0 #2b6a3a; }
      #loading .status { opacity: 0.75; }
      #loading.failed .status { letter-spacing: 0.05em; text-transform: none; }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>Bloxy</h1>
      <div class="status">Loading</div>
    </div>
    <script>
      const loading = document.getElementById("loading");
      const fail = (text) => {
        loading.classList.add("failed");
        loading.querySelector(".status").textContent = text;
      };
      if (!navigator.gpu) fail("Bloxy needs WebGPU. Try a recent Chrome or Edge.");
      addEventListener("error", () => fail("Bloxy failed to start."));
      new MutationObserver((_, watcher) => {
        if (document.querySelector("canvas")) {
          setTimeout(() => loading.remove(), 400);
          watcher.disconnect();
        }
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
