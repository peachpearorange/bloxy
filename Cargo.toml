[package]
name = "bloxy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  "bevy_winit",
  "bevy_window",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_light",
  "bevy_mesh",
  "bevy_image",
  "bevy_shader",
  "bevy_material",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "tonemapping_luts",
  "ktx2",
  "zstd_rust",
  "default_font",
  "serialize",
] }
bevy_replicon = "0.44.3"
serde = { version = "1.0.229", features = ["derive"] }
json5 = "1.3.1"
bytes = "1.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["multi_threaded", "x11", "wayland", "png"] }
tungstenite = "0.28"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["webgpu", "web"] }
tracing = { version = "0.1", features = ["release_max_level_warn"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "UrlSearchParams"] }

[features]
dev = ["bevy/dynamic_linking"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
